o3z> <div class="cases-ticker-preview" data-astro-cid-zga3ro3z><img src="/images/screenkit/screenkit-cover.webp" alt="" loading="lazy" data-astro-cid-zga3ro3z></div> <a class="cases-ticker-title" href="/work/screenkit" data-astro-cid-zga3ro3z><span data-astro-cid-zga3ro3z>Mockups That Animate, Localise, &amp; Drop In Like an Image</span></a> <div class="cases-ticker-impact" data-astro-cid-zga3ro3z><img class="cases-ticker-impact-arrow" data-impact-arrow src="/icons/arrow-up.svg" alt="" width="12" height="12" hidden data-astro-cid-zga3ro3z><span data-typed data-astro-cid-zga3ro3z></span><span class="cases-ticker-cursor" aria-hidden="true" data-astro-cid-zga3ro3z></span></div> </li><li class="cases-ticker-card" data-impacts="[{&quot;label&quot;:&quot;95% Faster Production per Asset&quot;},{&quot;label&quot;:&quot;Unlocked Self-Serve Production&quot;,&quot;direction&quot;:&quot;up&quot;},{&quot;label&quot;:&quot;Removed the Designer Bottleneck&quot;,&quot;direction&quot;:&quot;down&quot;}]" data-slug="brand-illustration" data-astro-cid-zga3ro3z> <div class="cases-ticker-preview" data-astro-cid-zga3ro3z><img src="/images/illustration/cover.webp" alt="" loading="lazy" data-astro-cid-zga3ro3z></div> <a class="cases-ticker-title" href="/work/brand-illustration" data-astro-cid-zga3ro3z><span data-astro-cid-zga3ro3z>On Brand Illustrations in Ten Minutes, by Anyone</span></a> <div class="cases-ticker-impact" data-astro-cid-zga3ro3z><img class="cases-ticker-impact-arrow" data-impact-arrow src="/icons/arrow-up.svg" alt="" width="12" height="12" hidden data-astro-cid-zga3ro3z><span data-typed data-astro-cid-zga3ro3z></span><span class="cases-ticker-cursor" aria-hidden="true" data-astro-cid-zga3ro3z></span></div> </li> </ul> </div> </div>  <script data-astro-rerun>
  // Cases ticker — Round 4 Disclosure · Arrows Below.
  // is:inline + data-astro-rerun so Astro re-executes this on every ClientRouter
  // navigation. A bundled module runs once and leaves the ticker dead after a
  // case study closes (verified: astro:page-load fires on return but the module
  // never re-inits). Wrapped in an IIFE so re-runs don't collide in the shared
  // inline-script global scope; teardown is held on window (which persists across
  // view transitions) so each run stops the previous instance's rAF loop, timers,
  // and window/document listeners before building a fresh one.
  (function () {
    if (window.__tickerCleanup) { window.__tickerCleanup(); window.__tickerCleanup = null; }

    const TYPE_MS = 40, ERASE_MS = 20, HOLD_MS = 3000, REVEAL_DELAY_MS = 500;
    const CARD_W = 480, SNAP_MS = 520, GLIDE_MS = 90000, TAU = 350;
    // Matches the CSS open transition. The typewriter waits it out rather than
    // writing textContent into cards that are still being laid out per frame.
    const EXPAND_MS = 820;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isMobile = () => window.matchMedia('(max-width: 430px)').matches;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    const ticker = document.querySelector('.cases-ticker');
    const track = document.querySelector('.cases-ticker-track');

    if (ticker && track) {
    // Per-instance behaviour, set by the component's props.
    //   keyboard: global arrow/Escape/Enter browsing. Off on a case page, whose
    //             layout already owns those keys for prev/next case and close.
    //   sheet:    tap-to-open mobile bottom sheet. Off on a case page, where the
    //             ticker ends an article and its titles are plain links; a
    //             full-screen sheet in document flow would stretch the page.
    const keyboardOn = ticker.dataset.keyboard !== 'off';
    const sheetOn = ticker.dataset.sheet !== 'off';
    const ac = new AbortController();
    const { signal } = ac;
    let rafId = 0;
    // Timestamp the open transition is expected to settle at. Set wherever the
    // expanded layout is entered; read by the typewriter.
    let expandUntil = 0;
    const markExpanding = () => { expandUntil = performance.now() + EXPAND_MS; };
    // Order is curated in src/data/cases.ts (strongest case first); the
    // on-load shuffle was removed deliberately.
    const baseCards = Array.from(track.querySelectorAll('.cases-ticker-card'));
    // Every card in DOM order, clones included. Rebuilt by fillLoop().
    let cards = baseCards.slice();
    let copies = 1;

    /* ---- Loop fill: as many clones as the viewport needs ----
       The contracted marquee wraps modulo one copy of the list, so the strip only
       reads as endless while the track holds a period plus the bar's own width.
       One copy is 1100-odd px, which runs out well before a 4K screen, hence the
       clone count is measured here rather than fixed in the markup. */
    const copyWidth = () => baseCards.reduce((s, c) => s + c.getBoundingClientRect().width, 0);
    function fillLoop() {
      const w = copyWidth();
      if (!w) return;  // not laid out yet; the fonts.ready pass comes back for it
      const want = 1 + Math.max(1, Math.ceil(ticker.clientWidth / w));
      if (want === copies) return;
      while (copies > want) {
        copies--;
        track.querySelectorAll('[data-copy="' + copies + '"]').forEach((n) => n.remove());
      }
      while (copies < want) {
        const frag = document.createDocumentFragment();
        baseCards.forEach((c) => {
          const clone = c.cloneNode(true);
          clone.removeAttribute('data-copy');
          clone.setAttribute('data-dup', 'true');
          clone.setAttribute('data-copy', String(copies));
          frag.appendChild(clone);
        });
        track.appendChild(frag);
        copies++;
      }
      cards = Array.from(track.querySelectorAll('.cases-ticker-card'));
      cards.forEach(wireCard);
      // A clone can be dropped while it holds the spotlight (viewport narrowing).
      if (spotCard && !track.contains(spotCard)) focusCard(null);
    }

    /* ---- Typed impact: cycles a case's impacts while highlighted ---- */
    const alive = (c, t) => c._token === t && !signal.aborted;
    async function typeText(el, text, perChar, c, t) { for (let i = 0; i < text.length; i++) { if (!alive(c, t)) return false; el.textContent = text.slice(0, i + 1); await sleep(perChar); } return alive(c, t); }
    async function eraseText(el, perChar, c, t) { const cur = el.textContent ?? ''; for (let i = cur.length; i > 0; i--) { if (!alive(c, t)) return false; el.textContent = cur.slice(0, i - 1); await sleep(perChar); } return alive(c, t); }
    // Arrow mirrors the Impact card's variant: down for reduced, up for improved,
    // hidden when the impact has no direction (a value card or a placeholder).
    function setArrow(c, impact) {
      if (!c._arrow) return;
      const dir = impact && impact.direction;
      if (!dir) { c._arrow.hidden = true; return; }
      c._arrow.src = dir === 'down' ? '/icons/arrow-down.svg' : '/icons/arrow-up.svg';
      c._arrow.hidden = false;
    }
    async function cycle(c, t) {
      const list = c._impacts; if (!list.length) return;
      // Hold off while the panel is still opening: each textContent write
      // invalidates a card that the transition is already re-laying out every
      // frame. Card-to-card focus once open keeps the plain reveal delay.
      await sleep(Math.max(REVEAL_DELAY_MS, expandUntil - performance.now()));
      if (!alive(c, t)) return;
      c._cursor.classList.add('is-active');
      let i = 0;
      while (alive(c, t)) {
        const impact = list[i % list.length];
        setArrow(c, impact);
        if (!(await typeText(c._typed, impact.label, TYPE_MS, c, t))) return;
        c._cursor.classList.add('is-blinking');
        await sleep(HOLD_MS);
        c._cursor.classList.remove('is-blinking');
        if (!alive(c, t)) return;
        if (list.length === 1) continue;
        if (!(await eraseText(c._typed, ERASE_MS, c, t))) return;
        i++;
      }
    }
    // Single spotlight + typing source. focusCard() is called by mouse hover
    // (real pointer) and by keyboard nav; whichever acts last owns the spotlight.
    let spotCard = null;
    function startType(c) {
      const t = ++c._token;
      if (reduce) { setArrow(c, c._impacts[0]); c._typed.textContent = (c._impacts[0] && c._impacts[0].label) || ''; c._cursor.classList.add('is-active'); return; }
      cycle(c, t);
    }
    async function stopType(c) {
      const t = ++c._token;
      c._cursor.classList.remove('is-blinking');
      setArrow(c, null);
      if (reduce) { c._typed.textContent = ''; c._cursor.classList.remove('is-active'); return; }
      await eraseText(c._typed, ERASE_MS, c, t);
      if (alive(c, t)) c._cursor.classList.remove('is-active');
    }
    function focusCard(card) {
      if (spotCard === card) return;
      if (spotCard) { spotCard.classList.remove('is-current'); stopType(spotCard); }
      spotCard = card || null;
      if (spotCard) { spotCard.classList.add('is-current'); startType(spotCard); }
    }

    // Runs for the shipped cards and again for every clone the loop fill adds, so
    // it has to be idempotent.
    function wireCard(c) {
      if (c._wired) return;
      c._wired = true;
      const impactEl = c.querySelector('.cases-ticker-impact');
      let list = [];
      try { list = JSON.parse(c.getAttribute('data-impacts') || '[]'); } catch {}
      c._impacts = Array.isArray(list) ? list : [];
      c._typed = impactEl.querySelector('[data-typed]');
      c._arrow = impactEl.querySelector('[data-impact-arrow]');
      c._cursor = impactEl.querySelector('.cases-ticker-cursor');
      c._title = c.querySelector('.cases-ticker-title');
      c._token = 0;
      // A clone is built from live DOM, so it can carry a half-typed impact line
      // or a spotlight class from the card it was copied off.
      c.classList.remove('is-current');
      if (c._typed) c._typed.textContent = '';
      if (c._arrow) c._arrow.hidden = true;
      if (c._cursor) c._cursor.classList.remove('is-active', 'is-blinking');
      if (c._title) { c._title.classList.remove('is-fade'); c._title.classList.toggle('is-wrapped', titlesWrapped); }
      c.addEventListener('mouseenter', (e) => {
        // Touch fires mouseenter on tap, which would start the typewriter and
        // re-wrap the impact line under the finger, shifting every row below it.
        // The sheet shows a static impact per row instead (see open()).
        if (isMobile()) return;
        if (e.isTrusted && (ticker.classList.contains('is-hot') || keyboardOpen)) focusCard(c);
      });
    }

    /* ---- Heading crossfade: single line <-> wrapped, swapped while invisible ---- */
    const TITLE_FADE_MS = 200;
    let titlesWrapped = false, titleTimer = null;
    function swapTitles(on) {
      cards.forEach((c) => c._title && c._title.classList.add('is-fade'));
      clearTimeout(titleTimer);
      titleTimer = setTimeout(() => {
        cards.forEach((c) => {
          if (!c._title) return;
          c._title.classList.toggle('is-wrapped', on);
          c._title.classList.remove('is-fade');
        });
      }, TITLE_FADE_MS);
    }
    function expandTitles() { if (titlesWrapped) return; titlesWrapped = true; swapTitles(true); }
    function collapseTitles() { if (!titlesWrapped) return; titlesWrapped = false; swapTitles(false); }

    /* ---- Snap marquee + keyboard ---- */
    let pos = 0, speed = 1, glideTarget = 1, lastT = performance.now();
    let period = 0;  // width of one copy of the list; the marquee's wrap distance
    let mode = 'auto'; // auto | hold | drag | snap
    let startX = 0, startPos = 0, dragDelta = 0, snapFrom = 0, snapTo = 0, snapStart = 0;
    let keyboardOpen = false, hotTimer = null, lastPx = 0, lastPy = 0;
    // Timestamp of the last close(), whatever closed it (tap, swipe, Escape,
    // outside tap). A tap that lands on the collapsed pill in the moment right
    // after a close is a reopen, never a navigate — see the click handler.
    let closedAt = 0;
    const REOPEN_GUARD_MS = 500;
    // Set when the pointer leaves the bar mid-drag; the hover teardown waits for
    // the gesture to finish (see mouseleave and endDrag).
    let hoverOutPending = false;

    const hintEl = document.querySelector('.front__hint');
    let hintTimer = null;
    const COLLAPSE_MS = 500;
    const hideHint = () => { clearTimeout(hintTimer); if (hintEl) hintEl.classList.add('is-out'); };
    const showHint = (delay) => { clearTimeout(hintTimer); hintTimer = setTimeout(() => { if (hintEl) hintEl.classList.remove('is-out'); }, delay); };

    // Two position regimes. Contracted, the track is the case list plus enough
    // clones to cover the bar, and the marquee wraps modulo one copy, so the loop
    // is seamless. Expanded, the clones are display:none and the position is
    // clamped between two ends instead. Mixing the two is what made a drag jump:
    // any wrap during a gesture teleports the track by a whole period.
    const isExpandedLayout = () =>
      ticker.classList.contains('is-hot') || ticker.classList.contains('is-open');
    // How far the expanded rail can be dragged. Cached, not read per frame: the
    // render loop writes track.style.transform, so a scrollWidth read in the same
    // frame forces a synchronous layout, and during the open transition there is
    // always pending invalidation to flush. Cards are border-box 480 while
    // expanded, so the value is stable from the first frame of the transition.
    let limit = 0;
    const measureLimit = () => { limit = Math.max(0, track.scrollWidth - ticker.clientWidth); };
    // Fill and period are only meaningful while contracted: expanded, the cards
    // are 480 wide and the clones are hidden, so both would be wrong.
    const recompute = () => {
      if (!isExpandedLayout()) { fillLoop(); period = copyWidth(); }
      measureLimit();
    };
    window.addEventListener('resize', recompute, { signal });
    // Card widths follow the webfont, so the first measurement can be off by the
